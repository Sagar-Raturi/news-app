{% load wagtailimages_tags %}{% if author.photo %}{% image author.photo fill-160x160 as photo %}<img src="{{ photo.url }}" alt="" class="{{ size|default:'h-12 w-12' }} shrink-0 rounded-full object-cover">{% else %}<span aria-hidden="true" class="{{ size|default:'h-12 w-12 text-sm' }} inline-flex shrink-0 items-center justify-center rounded-full bg-ink font-sans font-semibold text-paper">{{ author.initials }}</span>{% endif %}
