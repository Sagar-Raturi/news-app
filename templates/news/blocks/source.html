<li>{% if value.url %}<a class="font-medium text-ink underline decoration-rule underline-offset-2 hover:decoration-accent" href="{{ value.url }}" rel="noopener" target="_blank">{{ value.title }}</a>{% else %}<span class="font-medium text-ink">{{ value.title }}</span>{% endif %}{% if value.publisher %}, <span>{{ value.publisher }}</span>{% endif %}{% if value.note %} <span class="text-muted">— {{ value.note }}</span>{% endif %}</li>
