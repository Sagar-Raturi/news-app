{% load wagtailimages_tags %}
<figure>
  {% image value.image width-1400 as img %}
  <img src="{{ img.url }}" width="{{ img.width }}" height="{{ img.height }}" alt="{{ img.alt }}" loading="lazy" class="w-full">
  {% if value.caption or value.credit %}<figcaption>{{ value.caption }}{% if value.credit %} <span class="uppercase tracking-wider">{{ value.credit }}</span>{% endif %}</figcaption>{% endif %}
</figure>
